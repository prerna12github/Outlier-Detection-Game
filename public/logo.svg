<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Hard retro shadow -->
    <filter id="retro-shadow" x="-5%" y="-5%" width="125%" height="125%">
      <feDropShadow dx="16" dy="16" stdDeviation="0" flood-color="#30343B" />
    </filter>
  </defs>

  <!-- Hard shadow backplate -->
  <rect x="44" y="44" width="440" height="440" rx="72" fill="#30343B" />

  <!-- Base Retro-Paper Badge -->
  <rect x="28" y="28" width="440" height="440" rx="72" fill="#FFFCF4" stroke="#30343B" stroke-width="16" />

  <!-- Subtle Scientific Notebook Grid Lines -->
  <g stroke="#E8DDCB" stroke-width="2.5" stroke-dasharray="6,8">
    <line x1="88" y1="150" x2="408" y2="150" />
    <line x1="88" y1="230" x2="408" y2="230" />
    <line x1="88" y1="310" x2="408" y2="310" />
    <line x1="88" y1="390" x2="408" y2="390" />
    <line x1="150" y1="88" x2="150" y2="408" />
    <line x1="230" y1="88" x2="230" y2="408" />
    <line x1="310" y1="88" x2="310" y2="408" />
    <line x1="390" y1="88" x2="390" y2="408" />
  </g>

  <!-- Normal Data Cluster (Inliers) Region -->
  <ellipse cx="185" cy="315" rx="90" ry="60" fill="#245D9C" fill-opacity="0.08" stroke="#245D9C" stroke-width="3" stroke-dasharray="7,7" />

  <!-- Inlier Data Points (Academic Blue) -->
  <circle cx="145" cy="295" r="15" fill="#245D9C" stroke="#30343B" stroke-width="4.5" />
  <circle cx="195" cy="335" r="16" fill="#245D9C" stroke="#30343B" stroke-width="4.5" />
  <circle cx="225" cy="290" r="14" fill="#245D9C" stroke="#30343B" stroke-width="4.5" />
  <circle cx="170" cy="345" r="13" fill="#245D9C" stroke="#30343B" stroke-width="4.5" />
  <circle cx="130" cy="335" r="12" fill="#245D9C" stroke="#30343B" stroke-width="4.5" />

  <!-- Outlier Detection Reticle (Focusing on the anomaly) -->
  <!-- Pale orange detection aura -->
  <circle cx="340" cy="170" r="76" fill="#F4C5A5" fill-opacity="0.4" stroke="#E85D16" stroke-width="3" stroke-dasharray="6,6" />

  <!-- Inner radar sweep ring -->
  <circle cx="340" cy="170" r="46" fill="none" stroke="#E85D16" stroke-width="3" />

  <!-- Crosshair Pointer Lines -->
  <line x1="340" y1="76" x2="340" y2="124" stroke="#E85D16" stroke-width="6" stroke-linecap="round" />
  <line x1="340" y1="216" x2="340" y2="264" stroke="#E85D16" stroke-width="6" stroke-linecap="round" />
  <line x1="246" y1="170" x2="294" y2="170" stroke="#E85D16" stroke-width="6" stroke-linecap="round" />
  <line x1="386" y1="170" x2="434" y2="170" stroke="#E85D16" stroke-width="6" stroke-linecap="round" />

  <!-- Viewfinder Corner Brackets -->
  <path d="M 310 140 L 310 150 M 310 140 L 320 140" fill="none" stroke="#30343B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 370 140 L 370 150 M 370 140 L 360 140" fill="none" stroke="#30343B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 310 200 L 310 190 M 310 200 L 320 200" fill="none" stroke="#30343B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 370 200 L 370 190 M 370 200 L 360 200" fill="none" stroke="#30343B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- The OUTLIER (Burnt-Orange Anomaly) -->
  <circle cx="340" cy="170" r="26" fill="#E85D16" stroke="#30343B" stroke-width="6" />
  <!-- Gloss reflection -->
  <circle cx="332" cy="162" r="7" fill="#FFFFFF" fill-opacity="0.85" />
</svg>
